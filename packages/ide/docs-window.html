<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="any">
    <link rel="icon" type="image/png" href="%BASE_URL%megacrow-icon.png">
    <title>MegaloEvolved Docs</title>
    <!-- Match --bg-app before styles.css loads to avoid a white flash -->
    <style>
    html,
    body,
    .docs-shell {
      height: 100%;
      margin: 0;
      color-scheme: dark;
      background: #1e1e1e;
    }
    </style>
  </head>
  <body>
    <div class="docs-shell">
      <header class="docs-chrome" data-tauri-drag-region>
        <div class="docs-chrome-leading">
          <div aria-label="Page history" class="docs-nav" role="group">
            <button
              aria-label="Back"
              class="docs-nav-btn"
              disabled
              id="docs-back"
              title="Back (Alt+Left)"
              type="button"
            >
              <svg aria-hidden="true" viewBox="0 0 16 16">
                <path
                  d="M9.75 3.25 5 8l4.75 4.75"
                  fill="none"
                  stroke="currentColor"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  strokeWidth="1.35"
                />
              </svg>
            </button>
            <button
              aria-label="Forward"
              class="docs-nav-btn"
              disabled
              id="docs-forward"
              title="Forward (Alt+Right)"
              type="button"
            >
              <svg aria-hidden="true" viewBox="0 0 16 16">
                <path
                  d="M6.25 3.25 11 8l-4.75 4.75"
                  fill="none"
                  stroke="currentColor"
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  strokeWidth="1.35"
                />
              </svg>
            </button>
          </div>
          <span class="docs-chrome-title">Docs</span>
        </div>
        <div class="docs-chrome-trailing" id="docs-window-controls"></div>
      </header>
      <iframe
        class="docs-frame"
        id="docs-frame"
        src="about:blank"
        title="MegaloEvolved documentation"
      ></iframe>
    </div>
    <script type="module" src="/src/docs-window/main.ts"></script>
  </body>
</html>
